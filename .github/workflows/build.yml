name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # An invalid workflow file does not fail — it simply never runs, and nothing anywhere says
      # so. A `secrets` reference inside a step `if:` is rejected at parse time and takes the whole
      # file with it, which is how several tagged releases quietly produced nothing at all.
      - name: Check the workflows are valid
        shell: python
        run: |
          import pathlib, subprocess, sys

          try:
              import yaml
          except ImportError:
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pyyaml"], check=True)
              import yaml

          problems = []

          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  problems.append(f"{path}: will not parse — {exc}")
                  continue

              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith("if:") and "secrets." in stripped:
                      problems.append(
                          f"{path}:{number}: a step `if:` cannot read the secrets context, and "
                          f"using it there makes the whole file invalid so nothing runs. Put the "
                          f"secret in a job-level `env:` and test that instead.")

              if not any(str(path) in problem for problem in problems):
                  print(f"{path}: ok")

          for problem in problems:
              print(f"::error::{problem}")

          sys.exit(1 if problems else 0)

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CI has no XIVLauncher install, so grab the assemblies Dalamud ships and point the SDK at them.
      # Dalamud rejects an icon larger than 512x512 outright and shows a "?" in the plugin list
      # instead. Nothing warns you: the URL still returns the file, the manifest is still valid,
      # and the only symptom is a missing picture. Cheaper to fail here.
      - name: Check the icon
        shell: pwsh
        run: |
          $icon = "images/icon.png"
          if (-not (Test-Path $icon)) { throw "$icon is missing, but repo.json points at it." }

          $bytes = [System.IO.File]::ReadAllBytes($icon)
          if ($bytes.Length -lt 24) { throw "$icon is too small to be a PNG." }

          $png = [byte[]](137,80,78,71,13,10,26,10)
          for ($i = 0; $i -lt 8; $i++) {
            if ($bytes[$i] -ne $png[$i]) { throw "$icon is not a PNG." }
          }

          # Width and height are big-endian at offsets 16 and 20, straight after the IHDR tag.
          $width  = [System.BitConverter]::ToUInt32(($bytes[19..16]), 0)
          $height = [System.BitConverter]::ToUInt32(($bytes[23..20]), 0)
          $kb = [math]::Round($bytes.Length / 1KB)

          Write-Host "$icon is ${width}x${height}, ${kb} KB"

          if ($width -gt 512 -or $height -gt 512) {
            throw "Dalamud caps plugin icons at 512x512. This one is ${width}x${height} and will show as a '?' in the plugin list."
          }
          if ($width -ne $height) {
            throw "The icon should be square. This one is ${width}x${height}."
          }
          if ($kb -gt 1024) {
            throw "The icon is ${kb} KB. That is large enough to be worth resaving."
          }

      - name: Fetch Dalamud reference assemblies
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/goatcorp/dalamud-distrib/main/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath "$env:RUNNER_TEMP\dalamud" -Force
          "DALAMUD_HOME=$env:RUNNER_TEMP\dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Foxtrot/Foxtrot.csproj --configuration Release

      - name: Check the archive
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "Foxtrot\bin" -Recurse -Filter "latest.zip" -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $found) { throw "DalamudPackager produced no latest.zip." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($found.FullName)
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()

          foreach ($required in @('Foxtrot.dll', 'Foxtrot.json')) {
            if ($names -notcontains $required) { throw "$required missing from the archive root." }
          }

          $built = Get-Content (Join-Path $found.Directory.FullName "Foxtrot.json") -Raw | ConvertFrom-Json
          $repo  = (Get-Content "repo.json" -Raw | ConvertFrom-Json)[0]

          foreach ($field in @('IconUrl', 'RepoUrl', 'DownloadLinkInstall')) {
            if ($repo.$field -match 'YOURNAME|yourname') {
              throw "repo.json $field still has a placeholder: $($repo.$field)"
            }
          }
          if ($repo.DalamudApiLevel -ne $built.DalamudApiLevel) {
            throw "repo.json targets API $($repo.DalamudApiLevel), the plugin builds against $($built.DalamudApiLevel)."
          }
          if ($repo.AssemblyVersion -ne $built.AssemblyVersion) {
            Write-Warning "repo.json is $($repo.AssemblyVersion), the build is $($built.AssemblyVersion). Bump repo.json before tagging."
          }

          "dir=$($found.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Archive OK: $($names.Count) entries, version $($built.AssemblyVersion)."
        id: check

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Foxtrot
          path: ${{ steps.check.outputs.dir }}
          if-no-files-found: error
